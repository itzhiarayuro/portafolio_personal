# VibeCoding Security Toolkit — GitLab CI Pipeline
# Copia este archivo a la raíz de tu repositorio como .gitlab-ci.yml

stages:
  - security

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# ─────────────────────────────────────────────────────────────
# JOB 1: Gitleaks — Historial Git completo
# ─────────────────────────────────────────────────────────────
gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect
        --source .
        --config .gitleaks.toml
        --verbose
        --redact
        --exit-code 1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: false
  artifacts:
    when: on_failure
    reports:
      junit: gitleaks-report.xml
    paths:
      - gitleaks-report.xml
    expire_in: 30 days

# ─────────────────────────────────────────────────────────────
# JOB 2: CI Secret Checker — Patrones específicos Vibe Coding
# ─────────────────────────────────────────────────────────────
ci-secret-check:
  stage: security
  image: python:3.11-slim
  cache:
    paths:
      - .cache/pip
  script:
    - echo "=== VibeCoding CI Secret Checker ==="
    - python3 vibe-security-toolkit/ci_secret_check.py
        --path .
        --fail-on high
    - python3 vibe-security-toolkit/ci_secret_check.py
        --path .
        --fail-on none
        --json > secret-check-report.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: false
  artifacts:
    when: always
    paths:
      - secret-check-report.json
    expire_in: 30 days

# ─────────────────────────────────────────────────────────────
# JOB 3: Security Summary (solo si falla algún job)
# ─────────────────────────────────────────────────────────────
security-summary:
  stage: security
  image: alpine:latest
  script:
    - |
      echo "=========================================="
      echo "  🔴 SECRETOS O PATRONES INSEGUROS DETECTADOS"
      echo "=========================================="
      echo ""
      echo "PASOS DE REMEDIACIÓN:"
      echo "1. Rota inmediatamente todas las claves detectadas."
      echo "2. Elimina del historial:"
      echo "   git filter-repo --path <archivo> --invert-paths"
      echo "   # o: https://rtyley.github.io/bfg-repo-cleaner/"
      echo "3. Añade al .gitignore:"
      echo "   .env"
      echo "   .env.local"
      echo "   .env.production"
      echo "4. Para Supabase: ALTER TABLE ... ENABLE ROW LEVEL SECURITY"
      echo "5. Nunca uses service_role en VITE_ o NEXT_PUBLIC_ variables."
      echo ""
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_failure
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_failure
  allow_failure: true
